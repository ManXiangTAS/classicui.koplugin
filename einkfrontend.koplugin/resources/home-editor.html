<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨页 · 编辑主页</title>
<style>body{font:16px system-ui,sans-serif;margin:0;color:#111;background:#fff}header{position:sticky;top:0;background:#fff;border-bottom:2px solid;padding:14px;display:flex;gap:12px;align-items:center;z-index:1}h1{font-size:20px;margin:0;flex:1}button,input,select,textarea{font:inherit;color:inherit;background:#fff;border:1px solid #333;border-radius:0;padding:8px}button{cursor:pointer}button:disabled{opacity:.45}main{max-width:1100px;margin:20px auto;display:grid;grid-template-columns:minmax(250px,1fr) minmax(290px,1fr);gap:24px;padding:0 16px}aside{position:sticky;top:80px;align-self:start}#preview{display:block;max-width:100%;max-height:78vh;border:1px solid;margin:auto}#status{padding:12px 16px;min-height:24px}#search{width:100%;box-sizing:border-box}article{border-bottom:1px solid;padding:12px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.name{flex:1;min-width:130px}label{display:block;margin:12px 0}textarea{width:100%;box-sizing:border-box;min-height:110px}.note{font-size:14px;color:#444}#reload{display:none}@media(max-width:700px){main{display:flex;flex-direction:column}aside{position:static}#preview{max-height:45vh}header{flex-wrap:wrap}}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #111;outline-offset:2px}</style>
<header><h1>编辑主页</h1><button id="reload">重新载入</button><button id="save" disabled>保存到 Kindle</button></header><div id="status" role="status" aria-live="polite">正在连接…</div><main><aside><img id="preview" alt="Kindle 主页即时预览"><p id="capacity" class="note" aria-live="polite"></p><p class="note">主页固定一屏，组件自动适应高度；修改自动更新预览；点击保存后才会写入主页。关闭 Kindle 编辑器或等待15分钟后，连接结束。</p></aside><section><input id="search" placeholder="搜索主页部件" aria-label="搜索主页部件"><div id="widgets"></div><label>部件间距 <select id="spacing"><option value="standard">标准</option><option value="compact">紧凑</option></select></label><label>最近阅读数量 <select id="recent_count"><option>3</option><option>5</option></select></label><label>待读数量 <select id="tbr_count"><option>3</option><option>5</option></select></label><label>热力图周数 <select id="heatmap_weeks"><option>6</option><option>12</option><option>24</option></select></label><label>每日目标（分钟） <input id="daily_goal_minutes" type="number" min="1" max="1440"></label><label>名言（每行正文｜出处）<textarea id="quote_text" maxlength="16000"></textarea></label><button id="reset">恢复默认布局</button></section></main>
<script>
'use strict';
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);let state,revision,names={},timer,queue=Promise.resolve(),generation=0,previewURL,dirty=false,conflict=false,cancelBefore=-1;
const el=id=>document.getElementById(id),status=t=>el('status').textContent=t;
async function api(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!response.ok){if(response.status===409){conflict=true;el('reload').style.display='inline-block';throw Error('Kindle 上的布局已变化，请重新载入后再编辑');}let reason;try{reason=(await response.json()).error;}catch{}throw Error(response.status===401?'连接已失效，请在 Kindle 上重新扫码':reason||'请求失败（'+response.status+'）');}return response;}
function capacity(fit){if(fit)el('capacity').textContent='本屏显示 '+fit.visible+' / '+fit.requested+' 个部件'+(fit.fits?'':' · 超出 '+fit.omitted.length+' 个，请隐藏或调整宽度');}
async function preview(){const response=await api('/api/preview'),blob=await response.blob();if(previewURL)URL.revokeObjectURL(previewURL);previewURL=URL.createObjectURL(blob);el('preview').src=previewURL;}
function fields(){for(const key of ['spacing','recent_count','tbr_count','heatmap_weeks','daily_goal_minutes','quote_text'])el(key).value=state[key];render();el('save').disabled=!dirty;}
function render(){el('widgets').replaceChildren();const query=el('search').value.trim().toLowerCase();for(const [index,w]of state.widgets.entries()){const name=names[w.id]||w.id;const aliases={reading_return:'回本 购机 设备 价格 投入 金额 环形 价值',heatmap:'热力值 日历',weekly:'七天 柱图 一周',streak:'连续 天数',daypart:'时段 分布 时间'};if(!(name+' '+w.id+' '+(aliases[w.id]||'')).toLowerCase().includes(query))continue;const article=document.createElement('article'),row=document.createElement('div');row.className='row';const label=document.createElement('label');label.className='name';const enabled=document.createElement('input');enabled.type='checkbox';enabled.checked=w.enabled;enabled.addEventListener('change',()=>{w.enabled=enabled.checked;changed();});label.append(enabled,document.createTextNode(' '+name));row.append(label);const span=document.createElement('select');span.setAttribute('aria-label',name+'宽度');for(const [v,n]of [[2,'整行'],[1,'半行']]){const o=document.createElement('option');o.value=v;o.textContent=n;span.append(o);}span.value=w.span;span.addEventListener('change',()=>{w.span=Number(span.value);changed();});row.append(span);for(const delta of [-1,1]){const b=document.createElement('button');b.textContent=delta<0?'↑':'↓';b.setAttribute('aria-label',name+(delta<0?'上移':'下移'));b.disabled=index+delta<0||index+delta>=state.widgets.length;b.addEventListener('click',()=>{state.widgets.splice(index,1);state.widgets.splice(index+delta,0,w);render();changed();});row.append(b);}article.append(row);el('widgets').append(article);}}
function changed(){if(conflict)return;dirty=true;generation++;el('save').disabled=false;status('有未保存修改 · 更新预览中…');clearTimeout(timer);timer=setTimeout(()=>send(false),400);}
function send(save){clearTimeout(timer);const snapshot=JSON.parse(JSON.stringify(state)),at=generation;queue=queue.then(async()=>{if(at<=cancelBefore)return;if(conflict)throw Error('请先重新载入');const response=await api(save?'/api/save':'/api/layout',{config:snapshot,revision});const data=await response.json();revision=data.revision;capacity(data.fit);dirty=generation!==at||data.dirty;el('save').disabled=!dirty;status(data.saved&&!dirty?'已保存到 Kindle':dirty?'预览已更新 · 尚未保存':'已连接');await preview();}).catch(async error=>{const message=error.message;if(!conflict){cancelBefore=generation;clearTimeout(timer);try{const response=await api('/api/layout'),data=await response.json();state=data.config;revision=data.revision;dirty=data.dirty;capacity(data.fit);fields();await preview();}catch{}}else el('save').disabled=true;status(message+' · 本次修改未应用');});return queue;}
async function load(){try{clearTimeout(timer);await queue;const response=await api('/api/layout'),data=await response.json();state=data.config;revision=data.revision;names=Object.fromEntries(data.widgets.map(w=>[w.id,w.name]));conflict=false;dirty=data.dirty;el('reload').style.display='none';capacity(data.fit);fields();await preview();status(dirty?'已连接 · 有尚未保存的修改':'已连接 · 可以开始编辑');}catch(error){status(error.message);}}
for(const key of ['spacing','recent_count','tbr_count','heatmap_weeks','daily_goal_minutes','quote_text'])el(key).addEventListener('input',()=>{state[key]=['spacing','quote_text'].includes(key)?el(key).value:Number(el(key).value);if(key==='quote_text')state.quote_index=1;if(key==='daily_goal_minutes'&&(!Number.isInteger(state[key])||state[key]<1||state[key]>1440)){status('每日目标需要1—1440分钟');return;}changed();});
el('search').addEventListener('input',()=>state&&render());el('save').addEventListener('click',()=>send(true));el('reload').addEventListener('click',()=>{if(!dirty||confirm('重新载入会丢弃此页面未保存的修改，继续？'))load();});el('reset').addEventListener('click',()=>{if(!confirm('恢复默认布局？保留名言内容。'))return;state.widgets=Object.keys(names).map(id=>({id,enabled:['currently','reading_stats','overview'].includes(id),span:2}));state.spacing='standard';el('spacing').value='standard';render();changed();});addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});if(!/^[0-9a-f]{48}$/.test(token))status('请使用 Kindle 上的二维码打开此页面');else load();
</script></html>
