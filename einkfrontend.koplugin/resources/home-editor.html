<script>

async function load(){try{clearTimeout(timer);await queue;const response=await api('/api/layout'),data=await response.json();state=data.config;revision=data.revision;generation++;names=Object.fromEntries(data.widgets.map(w=>[w.id,w.name]));conflict=false;dirty=data.dirty;el('reload').style.display='none';capacity(data.fit);fields();await preview();status(dirty?'������ �� ����δ������޸�':'������ �� ���Կ�ʼ�༭');}catch(error){status(error.message);}}
