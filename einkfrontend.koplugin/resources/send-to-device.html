<div id="drop" class="drop"><div class="documents" aria-hidden="true"><img src="/assets/image-document.svg" alt=""><img src="/assets/text-document.svg" alt=""><img src="/assets/pdf-document.svg" alt=""></div><h3>���ļ��Ϸŵ��˴�</h3><button id="pick" class="primary">���豸��ѡ���ļ�</button><p>EPUB��PDF��TXT��MOBI��AZW3��CBZ �ȳ����鼮��ʽ<small>ÿ���ļ������� 200 MB �� ÿ����� 20 ���ļ�</small></p></div>
<div id="ready" hidden><div class="ready-head"><button class="link" id="clear">ȫ���Ƴ�</button></div><div id="filebox" class="filebox"><div id="files"></div><div class="more-files">�ϷŻ�<button class="link" id="more">���Ӹ����ļ�</button></div></div><div class="destination"><b>���浽��̨ Kindle �����</b><div>������ɺ󣬴�īҳ��⼴���Ķ���</div><small id="directory"></small></div><button id="send" class="primary" disabled>����</button><button id="cancel" hidden>ȡ������</button></div>

<script>
'use strict';
const $=s=>document.querySelector(s),MAX=200*1024*1024;let token=location.hash.slice(1);try{token=token||sessionStorage.getItem('moye-transfer-token')||'';if(token)sessionStorage.setItem('moye-transfer-token',token);}catch{}history.replaceState(null,'',location.pathname);
let queue=[],recent=[],busy=false,info=null,active=null,controller=null;const allowed=/\.(epub|pdf|txt|fb2|cbz|cbr|djvu|mobi|azw|azw3|html?|rtf|docx?)$/i;
function message(text,error=false){$('#message').textContent=text;$('#message').classList.toggle('error',error);}
function bytes(s){return new TextEncoder().encode(s).length;}
function priceValid(v){return v===''||v.length<=12&&/^\d+(\.\d{1,2})?$/.test(v)&&Number(v)<=999999.99;}
async function api(path,{body,raw=false,signal}={}){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,...(body===undefined?{}:{'Content-Type':raw?'application/octet-stream':'application/json'})},body:body===undefined?undefined:raw?body:JSON.stringify(body),signal});let d;try{d=await r.json();}catch(error){if(error.name==='AbortError')throw error;throw Error('�����жϣ����� Kindle ���¿�����ҳ����');}if(!r.ok)throw Error(r.status===401?'�����ѹ��ڣ����� Kindle ����ɨ��':d.error||'����δ��ɣ���������');return d;}
function make(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function render(){
 $('#drop').hidden=!!queue.length;$('#ready').hidden=!queue.length;$('#panel-title').textContent=queue.length?'׼������':'һ�η��ͣ���ʼ�Ķ���';$('#files').replaceChildren();
 queue.forEach((q,i)=>{
  const row=make('article','file'+(q.expanded?'':' collapsed')),head=make('div','file-head');
  const toggle=make('button','icon-button');toggle.setAttribute('aria-label','�༭ '+q.file.name);toggle.setAttribute('aria-expanded',String(q.expanded));toggle.append(make('span','chevron'));toggle.onclick=()=>{q.expanded=!q.expanded;render();};
  const icon=make('img','doc-icon');icon.src=/\.pdf$/i.test(q.file.name)?'/assets/pdf-document.svg':'/assets/text-document.svg';icon.alt='';
  const name=make('span','file-name',q.file.name),size=make('span','file-size',q.file.size>=1024*1024?(q.file.size/1024/1024).toFixed(1)+' MB':(q.file.size/1024).toFixed(1)+' KB');
  const remove=make('button','icon-button remove','��');remove.setAttribute('aria-label','�Ƴ� '+q.file.name);remove.disabled=busy;remove.onclick=()=>{queue=queue.filter(x=>x!==q);render();};head.append(toggle,icon,name,size,remove);row.append(head);
  const fields=make('div','fields');fields.hidden=!q.expanded;
  for(const [key,label] of [['title','���⣨���'],['author','����'],['price','����۸�Ԫ����ѡ��']]){
   const field=make('label','field'+(key==='price'?' price':'')),input=make('input');input.value=q[key];input.disabled=busy||q.sent;input.dataset.field=key;input.dataset.index=String(i);input.autocomplete='off';
   if(key==='price'){input.maxLength=12;input.inputMode='decimal';input.placeholder='���� 39.80';}else{input.maxLength=200;input.required=key==='title';if(key==='author')input.placeholder='���ձ���ԭ����';}
   input.oninput=()=>{q[key]=input.value;input.setCustomValidity('');};field.append(make('span','',label),input);
   if(key==='price')field.append(make('small','','����������ҳ�ġ��Ķ��ر��������ղ��ƽ��������� 0��'));
   fields.append(field);
  }
  row.append(fields);const status=make('div','status'+(q.error?' error':q.sent?' good':''),q.sent?(q.warning||'���ʹ� �� '+q.saved):q.error||q.stage||'');
  if(q.progress!=null){const p=make('progress');p.max=100;p.value=q.progress;p.setAttribute('aria-label',q.file.name+' ���ͽ���');status.append(p);}row.append(status);$('#files').append(row);
 });
 $('#send').disabled=busy||!info||!queue.some(q=>!q.sent);$('#send').textContent=busy?'���ڷ��͡�':'����';$('#cancel').hidden=!busy;for(const id of ['pick','more','clear'])$('#'+id).disabled=busy;
 $('#recent').hidden=!recent.length;$('#recent-list').replaceChildren();for(const r of recent.slice(-20).reverse()){const el=make('div','recent-item');el.append(make('span','',r.title),make('span','good','���ʹ�'));$('#recent-list').append(el);}
}
function add(files){if(busy)return;let errors=[];for(const file of files){if(queue.length>=20){errors.push('ÿ�����ѡ��20���ļ���');break;}if(!allowed.test(file.name)||file.size===0||file.size>MAX||bytes(file.name)>180||/[\x00-\x1f\x7f/\\:*?"<>|]/.test(file.name)||file.name.startsWith('.')||/[ .]$/.test(file.name)){errors.push('�޷����ӣ�'+file.name+'�������ʽ����С���ļ�����');continue;}if(!queue.some(q=>q.file.name===file.name&&q.file.size===file.size&&q.file.lastModified===file.lastModified))queue.push({file,title:file.name.replace(/\.[^.]+$/,''),author:'',price:'',expanded:true});}if(errors.length)message(errors.join('\n'),true);else message(info?'':'�������� Kindle��');render();}
$('#pick').onclick=$('#more').onclick=()=>$('#input').click();$('#input').onchange=e=>{add(e.target.files);e.target.value='';};$('#clear').onclick=()=>{queue=[];message('');render();};
for(const selector of ['#drop','#filebox']){const area=$(selector);for(const type of ['dragenter','dragover'])area.addEventListener(type,e=>{e.preventDefault();if(!busy)area.classList.add('over');if(area.id==='drop')for(const img of area.querySelectorAll('.documents img'))img.src=img.src.replace('-blue.svg','.svg').replace('.svg','-blue.svg');});for(const type of ['dragleave','drop'])area.addEventListener(type,e=>{e.preventDefault();area.classList.remove('over');if(area.id==='drop')for(const img of area.querySelectorAll('.documents img'))img.src=img.src.replace('-blue.svg','.svg');});area.addEventListener('drop',e=>add(e.dataTransfer.files));}
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());$('#cancel').onclick=()=>controller?.abort();
function validate(){for(const q of queue.filter(q=>!q.sent)){
 let key,error;if(!q.title.trim()||bytes(q.title)>600||/[\x00-\x1f\x7f]/.test(q.title)){key='title';error='����д��Ч������������200�֣���';}else if(bytes(q.author)>600||/[\x00-\x1f\x7f]/.test(q.author)){key='author';error='���߲�����200�֣��Ҳ��ܰ��������ַ���';}else if(!priceValid(q.price.trim())){key='price';error='����۸�Ӧ��0��999999.99Ԫ֮�䣬�����λС����';}
 if(error){q.expanded=true;render();const input=document.querySelector(`[data-index="${queue.indexOf(q)}"][data-field="${key}"]`);input.setCustomValidity(error);input.reportValidity();input.focus();message(error,true);return false;}
 }return true;}
function filename(q){const ext=q.file.name.match(/\.[^.]+$/)[0];let stem=q.title.trim().replace(/[\x00-\x1f\x7f/\\:*?"<>|]/g,'_').replace(/^[ .]+|[ .]+$/g,'')||'δ����';while(bytes(stem+ext)>180)stem=Array.from(stem).slice(0,-1).join('');return stem+ext;}
$('#send').onclick=async()=>{
 if(busy||!info||!validate())return;busy=true;controller=new AbortController();render();let failed=false;
 try{for(const q of queue.filter(x=>!x.sent)){
  controller.signal.throwIfAborted();q.error=null;q.stage='���ڷ��͡�';q.progress=0;render();
  try{
   active=await api('/api/begin',{body:{name:filename(q),size:q.file.size,title:q.title.trim(),...(q.author.trim()?{author:q.author.trim()}:{}),price:q.price.trim()},signal:controller.signal});
   for(let offset=0;offset<q.file.size;){const chunk=q.file.slice(offset,Math.min(offset+info.chunk,q.file.size));const d=await api('/api/chunk/'+active.id+'/'+offset,{body:chunk,raw:true,signal:controller.signal});if(!Number.isInteger(d.offset)||d.offset<=offset||d.offset>q.file.size)throw Error('���ս����쳣������������');offset=d.offset;q.progress=100*offset/q.file.size;render();}
   let d;try{d=await api('/api/finish/'+active.id,{body:new Uint8Array(),raw:true,signal:controller.signal});}catch(e){if(controller.signal.aborted)throw e;d=await api('/api/finish/'+active.id,{body:new Uint8Array(),raw:true,signal:controller.signal});}
   active=null;q.sent=true;q.saved=d.name;q.warning=d.warning;q.progress=100;q.stage=null;q.expanded=false;recent.push({title:q.title});render();
  }catch(e){failed=true;q.error=e.name==='AbortError'?'��ȡ�������ʹ���ļ�����':e.message;q.progress=null;render();if(active){await api('/api/cancel/'+active.id,{body:new Uint8Array(),raw:true}).catch(()=>{});active=null;}if(controller.signal.aborted)throw e;}
 }
 message(failed?'�����ļ�δ���ͣ���鿴��Ӧ��ʾ��':'������ɣ��� Kindle ��⿪ʼ�Ķ���',failed);
 }catch(e){message(e.name==='AbortError'?'������ȡ��������ɵ��ļ�������':e.message,e.name!=='AbortError');}
 finally{busy=false;controller=null;render();}
};
window.addEventListener('beforeunload',e=>{if(busy){e.preventDefault();e.returnValue='';}});
api('/api/info').then(d=>{if(!Number.isInteger(d.chunk)||d.chunk<1||d.chunk>65536)throw Error('������Ϣ�쳣��������ɨ��');info=d;$('#directory').textContent=d.directory;message('');render();}).catch(e=>message(e.message,true));render();
</script></body></html>
