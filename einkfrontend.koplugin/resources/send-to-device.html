<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>发送至 Kindle · 墨页</title>
<style>
:root{--ink:#0f1111;--muted:#565959;--blue:#007185;--line:#adb1b8;--paper:#f0f2f2;--yellow:#ffdf00}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 Arial,'Microsoft YaHei',sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:default;opacity:.48}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #007185;outline-offset:3px}header{max-width:1255px;margin:auto;height:82px;padding:0 50px;display:flex;align-items:center;gap:19px}header b{font-size:26px;letter-spacing:3px}header span{border-left:1px solid #bbb;padding-left:19px;font-size:16px}main{max-width:1255px;margin:auto;padding:0 50px 70px}h1{font-size:34px;font-weight:400;margin:12px 0 29px}.panel{background:var(--paper);padding:48px 50px 50px}.panel h2{font-size:32px;font-weight:400;margin:0 0 16px}.drop{border:1px dashed #929797;background:white;text-align:center;padding:42px 25px 40px}.drop.over,.filebox.over{outline:3px solid #007185;background:#f6fbfc}.documents{height:78px;display:flex;justify-content:center;gap:24px;margin-bottom:26px}.documents img{width:54px;height:72px;object-fit:contain}.drop h3{font-size:25px;font-weight:400;margin:0 0 18px}.primary{background:var(--yellow);border:1px solid #f3cf00;border-radius:10px;padding:12px 38px;box-shadow:0 2px 5px #ddd6;color:#111}.primary:hover{background:#f7cf00}.drop p{font-size:14px;color:var(--muted);margin:23px 0 0}.drop small{display:block;margin-top:5px}.link{color:var(--blue);border:0;background:none;padding:0;min-height:32px}.link:hover{text-decoration:underline}.ready-head{display:flex;justify-content:flex-end;margin-top:-7px;margin-bottom:5px}.ready-head button{font-size:20px}.filebox{border:1px dashed #999;background:#fff}.file{border-bottom:1px solid #d5d9d9}.file:last-child{border-bottom:0}.file-head{display:flex;align-items:center;gap:12px;padding:22px 23px;min-height:76px}.icon-button{border:0;background:transparent;width:32px;height:32px;padding:0;flex:none;display:grid;place-items:center}.chevron{display:block;border:solid #111;border-width:0 2px 2px 0;width:13px;height:13px;transform:rotate(45deg);margin-top:-7px}.collapsed .chevron{transform:rotate(-45deg);margin-top:0}.doc-icon{width:22px;height:28px;object-fit:contain;flex:none}.file-name{font-size:20px;overflow-wrap:anywhere;flex:1;min-width:0;unicode-bidi:plaintext}.file-size{font-size:18px;white-space:nowrap;margin:0 25px 0 10px}.remove{font-size:28px;line-height:1}.fields{padding:7px 32px 26px}.field{display:block;margin:5px 0 29px}.field:last-child{margin-bottom:0}.field span{display:block;font-weight:700;margin-bottom:7px}.field input{display:block;width:100%;border:1px solid #888c8c;border-radius:9px;box-shadow:0 1px 2px #ddd8 inset;padding:7px 13px;height:42px;background:#fff}.field.price input{max-width:300px}.field small{display:block;color:var(--muted);font-size:13px;margin-top:7px}.more-files{background:#f7fafa;padding:15px 30px;font-size:21px}.more-files button{font-size:21px}.destination{margin:36px 0 0;line-height:1.6}.destination b{font-size:19px}.destination small{display:block;color:var(--muted);overflow-wrap:anywhere;margin-top:3px}#send{width:100%;font-weight:700;margin-top:45px;min-height:60px;font-size:20px}#cancel{display:block;margin:18px auto 0;border:1px solid #adb1b8;border-radius:9px;background:#fff;padding:8px 30px}.status{margin:0 32px 20px;font-size:14px;overflow-wrap:anywhere}.status:empty{display:none}.error{color:#b12704}.good{color:#067d62}.status progress{display:block;width:100%;height:7px;accent-color:#007185;margin-top:9px}.message{font-size:14px;min-height:24px;margin-top:20px;white-space:pre-line}#message:empty{display:none}.recent{margin-top:46px}.recent summary{font-size:20px;cursor:pointer;list-style:none}.recent summary::after{content:'›';margin-left:20px;font-size:29px;vertical-align:-2px}.recent[open] summary::after{content:'⌄'}#recent-list{padding:14px 0}.recent-item{border-bottom:1px solid #ddd;padding:14px 0;display:flex;gap:20px;justify-content:space-between}.recent-item span:first-child{overflow-wrap:anywhere}.privacy{margin-top:36px;font-size:13px;color:var(--muted)}[hidden]{display:none!important}#input{display:none}@media(max-width:650px){header{height:65px;padding:0 20px}header b{font-size:23px}header span{font-size:14px}main{padding:0 14px 35px}h1{font-size:27px;margin:12px 6px 22px}.panel{padding:27px 18px}.panel h2{font-size:27px}.drop{padding:30px 12px}.drop h3{font-size:21px}.documents{gap:18px}.ready-head button{font-size:16px}.file-head{padding:15px 10px;gap:8px;flex-wrap:wrap}.file-name{font-size:16px}.file-size{font-size:13px;margin:0 3px}.fields{padding:5px 18px 23px}.field{margin-bottom:23px}.file-head .icon-button{width:24px}.doc-icon{width:18px;height:24px}.more-files{padding:14px 17px;font-size:17px}.more-files button{font-size:17px}.destination{margin-top:27px}.destination b{font-size:17px}#send{margin-top:30px}.status{margin-left:18px;margin-right:18px}.recent{margin:30px 6px 0}.privacy{margin-left:6px}.field.price input{max-width:none}}
@media(prefers-reduced-motion:no-preference){.drop,.primary{transition:background .15s}.chevron{transition:transform .15s}}
</style></head><body><header><b>墨页</b><span>网页传书</span></header><main><h1>发送至 Kindle</h1><section class="panel" aria-labelledby="panel-title"><h2 id="panel-title">一次发送，开始阅读。</h2>
<div id="drop" class="drop"><div class="documents" aria-hidden="true"><img src="/assets/image-document.svg" alt=""><img src="/assets/text-document.svg" alt=""><img src="/assets/pdf-document.svg" alt=""></div><h3>将文件拖放到此处</h3><button id="pick" class="primary">从设备中选择文件</button><p>EPUB、PDF、TXT、MOBI、AZW3、CBZ 等常见书籍格式<small>每个文件不超过 200 MB · 每次最多 20 个文件</small></p></div>
<div id="ready" hidden><div class="ready-head"><button class="link" id="clear">全部移除</button></div><div id="filebox" class="filebox"><div id="files"></div><div class="more-files">拖放或<button class="link" id="more">添加更多文件</button></div></div><div class="destination"><b>保存到这台 Kindle 的书库</b><div>发送完成后，打开墨页书库即可阅读。</div><small id="directory"></small></div><button id="send" class="primary" disabled>发送</button><button id="cancel" hidden>取消发送</button></div>
<div id="message" class="message" role="status" aria-live="polite"></div></section><details id="recent" class="recent" hidden><summary>最近发送的文件</summary><div id="recent-list"></div></details><p class="privacy">手机或电脑与 Kindle 连接同一 Wi-Fi。文件直接保存在设备上。</p><input id="input" type="file" multiple accept=".epub,.pdf,.txt,.fb2,.cbz,.cbr,.djvu,.mobi,.azw,.azw3,.html,.htm,.rtf,.doc,.docx"></main>
<script>
'use strict';
const $=s=>document.querySelector(s),MAX=200*1024*1024;let token=location.hash.slice(1)||sessionStorage.getItem('moye-transfer-token')||'';history.replaceState(null,'',location.pathname);if(token)sessionStorage.setItem('moye-transfer-token',token);
let queue=[],recent=[],busy=false,info=null,active=null,controller=null;const allowed=/\.(epub|pdf|txt|fb2|cbz|cbr|djvu|mobi|azw|azw3|html?|rtf|docx?)$/i;
function message(text,error=false){$('#message').textContent=text;$('#message').classList.toggle('error',error);}
function bytes(s){return new TextEncoder().encode(s).length;}
function priceValid(v){return v===''||/^\d+(\.\d{1,2})?$/.test(v)&&Number(v)<=999999.99;}
async function api(path,{body,raw=false,signal}={}){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,...(body===undefined?{}:{'Content-Type':raw?'application/octet-stream':'application/json'})},body:body===undefined?undefined:raw?body:JSON.stringify(body),signal});let d;try{d=await r.json();}catch{throw Error('连接中断，请在 Kindle 重新开启网页传书');}if(!r.ok)throw Error(r.status===401?'连接已过期，请在 Kindle 重新扫码':d.error||'发送未完成，请检查连接');return d;}
function make(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function render(){
 $('#drop').hidden=!!queue.length;$('#ready').hidden=!queue.length;$('#panel-title').textContent=queue.length?'准备发送':'一次发送，开始阅读。';$('#files').replaceChildren();
 queue.forEach((q,i)=>{
  const row=make('article','file'+(q.expanded?'':' collapsed')),head=make('div','file-head');
  const toggle=make('button','icon-button');toggle.setAttribute('aria-label','编辑 '+q.file.name);toggle.setAttribute('aria-expanded',String(q.expanded));toggle.append(make('span','chevron'));toggle.onclick=()=>{q.expanded=!q.expanded;render();};
  const icon=make('img','doc-icon');icon.src=/\.pdf$/i.test(q.file.name)?'/assets/pdf-document.svg':'/assets/text-document.svg';icon.alt='';
  const name=make('span','file-name',q.file.name),size=make('span','file-size',q.file.size>=1024*1024?(q.file.size/1024/1024).toFixed(1)+' MB':(q.file.size/1024).toFixed(1)+' KB');
  const remove=make('button','icon-button remove','×');remove.setAttribute('aria-label','移除 '+q.file.name);remove.disabled=busy;remove.onclick=()=>{queue=queue.filter(x=>x!==q);render();};head.append(toggle,icon,name,size,remove);row.append(head);
  const fields=make('div','fields');fields.hidden=!q.expanded;
  for(const [key,label] of [['title','标题（必填）'],['author','作者'],['price','本书价格（元，可选）']]){
   const field=make('label','field'+(key==='price'?' price':'')),input=make('input');input.value=q[key];input.disabled=busy||q.sent;input.dataset.field=key;input.dataset.index=String(i);input.autocomplete='off';
   if(key==='price'){input.inputMode='decimal';input.placeholder='例如 39.80';}else{input.maxLength=200;input.required=key==='title';if(key==='author')input.placeholder='留空保留原作者';}
   input.oninput=()=>{q[key]=input.value;input.setCustomValidity('');};field.append(make('span','',label),input);
   if(key==='price')field.append(make('small','','读完后计入主页的「阅读回报」。留空不计金额，免费书可填 0。'));
   fields.append(field);
  }
  row.append(fields);const status=make('div','status'+(q.error?' error':q.sent?' good':''),q.sent?(q.warning||'已送达 · '+q.saved):q.error||q.stage||'');
  if(q.progress!=null){const p=make('progress');p.max=100;p.value=q.progress;p.setAttribute('aria-label',q.file.name+' 发送进度');status.append(p);}row.append(status);$('#files').append(row);
 });
 $('#send').disabled=busy||!info||!queue.some(q=>!q.sent);$('#send').textContent=busy?'正在发送…':'发送';$('#cancel').hidden=!busy;for(const id of ['pick','more','clear'])$('#'+id).disabled=busy;
 $('#recent').hidden=!recent.length;$('#recent-list').replaceChildren();for(const r of recent.slice(-20).reverse()){const el=make('div','recent-item');el.append(make('span','',r.title),make('span','good','已送达'));$('#recent-list').append(el);}
}
function add(files){if(busy)return;let errors=[];for(const file of files){if(queue.length>=20){errors.push('每次最多选择20个文件。');break;}if(!allowed.test(file.name)||file.size===0||file.size>MAX||bytes(file.name)>180||/[\x00-\x1f\x7f/\\:*?"<>|]/.test(file.name)||file.name.startsWith('.')||/[ .]$/.test(file.name)){errors.push('无法添加：'+file.name+'（请检查格式、大小或文件名）');continue;}if(!queue.some(q=>q.file.name===file.name&&q.file.size===file.size&&q.file.lastModified===file.lastModified))queue.push({file,title:file.name.replace(/\.[^.]+$/,''),author:'',price:'',expanded:true});}if(errors.length)message(errors.join('\n'),true);else message(info?'':'正在连接 Kindle…');render();}
$('#pick').onclick=$('#more').onclick=()=>$('#input').click();$('#input').onchange=e=>{add(e.target.files);e.target.value='';};$('#clear').onclick=()=>{queue=[];message('');render();};
for(const selector of ['#drop','#filebox']){const area=$(selector);for(const type of ['dragenter','dragover'])area.addEventListener(type,e=>{e.preventDefault();if(!busy)area.classList.add('over');});for(const type of ['dragleave','drop'])area.addEventListener(type,e=>{e.preventDefault();area.classList.remove('over');});area.addEventListener('drop',e=>add(e.dataTransfer.files));}
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());$('#cancel').onclick=()=>controller?.abort();
function validate(){for(const q of queue.filter(q=>!q.sent)){
 let key,error;if(!q.title.trim()||bytes(q.title)>600||/[\x00-\x1f\x7f]/.test(q.title)){key='title';error='请填写有效书名（不超过200字）。';}else if(bytes(q.author)>600||/[\x00-\x1f\x7f]/.test(q.author)){key='author';error='作者不超过200字，且不能包含控制字符。';}else if(!priceValid(q.price.trim())){key='price';error='本书价格应在0至999999.99元之间，最多两位小数。';}
 if(error){q.expanded=true;render();const input=document.querySelector(`[data-index="${queue.indexOf(q)}"][data-field="${key}"]`);input.setCustomValidity(error);input.reportValidity();input.focus();message(error,true);return false;}
 }return true;}
function filename(q){const ext=q.file.name.match(/\.[^.]+$/)[0];let stem=q.title.trim().replace(/[\x00-\x1f\x7f/\\:*?"<>|]/g,'_').replace(/^[ .]+|[ .]+$/g,'')||'未命名';while(bytes(stem+ext)>180)stem=Array.from(stem).slice(0,-1).join('');return stem+ext;}
$('#send').onclick=async()=>{
 if(busy||!info||!validate())return;busy=true;controller=new AbortController();render();let failed=false;
 try{for(const q of queue.filter(x=>!x.sent)){
  controller.signal.throwIfAborted();q.error=null;q.stage='正在发送…';q.progress=0;render();
  try{
   active=await api('/api/begin',{body:{name:filename(q),size:q.file.size,title:q.title.trim(),...(q.author.trim()?{author:q.author.trim()}:{}),price:q.price.trim()},signal:controller.signal});
   for(let offset=0;offset<q.file.size;){const chunk=q.file.slice(offset,Math.min(offset+info.chunk,q.file.size));const d=await api('/api/chunk/'+active.id+'/'+offset,{body:chunk,raw:true,signal:controller.signal});if(!Number.isInteger(d.offset)||d.offset<=offset||d.offset>q.file.size)throw Error('接收进度异常，请重新连接');offset=d.offset;q.progress=100*offset/q.file.size;render();}
   let d;try{d=await api('/api/finish/'+active.id,{body:new Uint8Array(),raw:true,signal:controller.signal});}catch(e){if(controller.signal.aborted)throw e;d=await api('/api/finish/'+active.id,{body:new Uint8Array(),raw:true,signal:controller.signal});}
   active=null;q.sent=true;q.saved=d.name;q.warning=d.warning;q.progress=100;q.stage=null;q.expanded=false;recent.push({title:q.title});render();
  }catch(e){failed=true;q.error=e.name==='AbortError'?'已取消；已送达的文件保留':e.message;q.progress=null;render();if(active){await api('/api/cancel/'+active.id,{body:new Uint8Array(),raw:true}).catch(()=>{});active=null;}if(controller.signal.aborted)throw e;}
 }
 message(failed?'部分文件未发送，请查看对应提示。':'发送完成，打开 Kindle 书库开始阅读。',failed);
 }catch(e){message(e.name==='AbortError'?'发送已取消。已完成的文件保留。':e.message,e.name!=='AbortError');}
 finally{busy=false;controller=null;render();}
};
window.addEventListener('beforeunload',e=>{if(busy){e.preventDefault();e.returnValue='';}});
api('/api/info').then(d=>{if(!Number.isInteger(d.chunk)||d.chunk<1||d.chunk>65536)throw Error('连接信息异常，请重新扫码');info=d;$('#directory').textContent=d.directory;message('');render();}).catch(e=>message(e.message,true));render();
</script></body></html>
