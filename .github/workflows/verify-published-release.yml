name: Verify published release bytes
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-published-release.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: bc1c09aaf6a849f42906934e6f1dcd6bf65fc2fc
      - name: Verify source and rebuild reviewed artifacts
        run: |
          python3 tests/verify_source_utf8.py
          python3 tests/build_public_release.py rebuilt
      - name: Download public release and verify every archive entry
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, urllib.request, zipfile
          base = 'https://api.github.com/repos/ManXiangTAS/classicui.koplugin'
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'ClassicUI-verify'}), timeout=90) as r: return r.read()
          release = json.loads(get(base+'/releases/tags/v0.7.3'))
          assert not release['draft'] and not release['prerelease']
          for kind in ['install','source']:
              name = 'ClassicUI_0.7.3_'+kind+'.zip'
              asset = next(a for a in release['assets'] if a['name']==name)
              data = get(asset['browser_download_url'])
              digest = hashlib.sha256(data).hexdigest()
              assert asset['digest']=='sha256:'+digest
              with zipfile.ZipFile(io.BytesIO(data)) as actual, zipfile.ZipFile(pathlib.Path('rebuilt')/name) as expected:
                  assert actual.testzip() is None
                  assert set(actual.namelist())==set(expected.namelist())
                  for path in expected.namelist():
                      assert actual.read(path)==expected.read(path), 'Entry mismatch: '+path
                  meta = actual.read('einkfrontend.koplugin/_meta.lua').decode('utf-8')
                  assert '\u58a8\u9875' in meta and '\ufffd' not in meta
                  print(name+': verified '+str(len(actual.namelist()))+' exact entries; SHA256 '+digest)
          PY
