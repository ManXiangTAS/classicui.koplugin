name: Verify published release bytes
on:
  workflow_run:
    workflows: [Build release artifacts]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify source and rebuild reviewed artifacts
        run: |
          python3 tests/verify_source_utf8.py
          python3 tests/build_public_release.py rebuilt
      - name: Download public release and verify every archive entry
        env:
          EXPECTED_RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 tools/verify_published_release.py rebuilt --optional
