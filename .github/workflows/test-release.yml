name: Build release artifacts
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_confirmed:
        description: Publish only after the maintainer has confirmed device stability
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: classicui-test-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Withdraw corrupted release and restore verified stable download
        if: github.event.head_commit.message == 'Restore verified 0.7.0 after damaged 0.7.3 publication'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/ManXiangTAS/classicui.koplugin/releases'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def req(url, data=None):
              request = urllib.request.Request(url, headers=headers, data=json.dumps(data).encode() if data is not None else None, method='PATCH' if data is not None else 'GET')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          releases = req(base + '?per_page=100')
          broken = next(r for r in releases if r['tag_name'] == 'v0.7.3')
          stable = next(r for r in releases if r['tag_name'] == 'v0.7.0')
          assert req(base + '/' + str(broken['id']), {'draft': True})['draft']
          restored = req(base + '/' + str(stable['id']), {'draft': False, 'prerelease': False, 'make_latest': 'true'})
          assert not restored['draft'] and not restored['prerelease']
          print('Corrupted 0.7.3 withdrawn; verified 0.7.0 restored.')
          PY
      - name: Restore verified guide from bounded transfer parts
        if: hashFiles('.bootstrap/guide-*.part') != ''
        run: |
          python3 .bootstrap/restore.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Restore verified offline guide and clean transfer staging'
          git push origin HEAD:main
      - name: Import reviewed source snapshot on first publication
        if: hashFiles('.bootstrap/source.zip') != ''
        run: |
          python3 tools/import_public_snapshot.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Import verified ClassicUI 0.4.0-test.1 source snapshot'
          git push origin HEAD:main
      - name: Verify source and build reproducible artifacts
        run: |
          python3 tests/test_release_policy.py
          python3 tests/build_public_release.py dist
      - name: Prepare or publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_CONFIRMED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_confirmed && '1' || '0' }}
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: GITHUB_SHA=$(git rev-parse HEAD) python3 tools/publish_test_release.py dist
