name: Build release artifacts
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_confirmed:
        description: Publish only after the maintainer has confirmed device stability
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: classicui-test-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Restore verified guide from bounded transfer parts
        if: hashFiles('.bootstrap/guide-*.part') != ''
        run: |
          python3 .bootstrap/restore.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Restore verified offline guide and clean transfer staging'
          git push origin HEAD:main
      - name: Import reviewed source snapshot on first publication
        if: hashFiles('.bootstrap/source.zip') != ''
        run: |
          python3 tools/import_public_snapshot.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Import verified ClassicUI 0.4.0-test.1 source snapshot'
          git push origin HEAD:main
      - name: Verify exact source bytes before building
        run: python3 tests/verify_source_utf8.py
      - name: Repair withdrawn 0.7.3 release tag and metadata
        if: github.event.head_commit.message == 'Release ClassicUI 0.7.3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/ManXiangTAS/classicui.koplugin'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def req(path, data=None):
              r = urllib.request.Request(base+path, headers=headers, method='PATCH' if data is not None else 'GET', data=json.dumps(data).encode() if data is not None else None)
              with urllib.request.urlopen(r, timeout=60) as response: return json.load(response)
          releases = req('/releases?per_page=100')
          matches = [r for r in releases if r['tag_name']=='v0.7.3' or r['name'].endswith('ClassicUI 0.7.3')]
          assert len(matches)==1 and matches[0]['draft'], 'Only the withdrawn release may be repaired'
          name = '\u58a8\u9875 \u00b7 ClassicUI 0.7.3'
          req('/releases/'+str(matches[0]['id']), {'name':name, 'tag_name':'v0.7.3', 'target_commitish':os.environ['GITHUB_SHA']})
          tag = req('/git/refs/tags/v0.7.3', {'sha':os.environ['GITHUB_SHA'], 'force':True})
          assert tag['object']['sha']==os.environ['GITHUB_SHA']
          PY
      - name: Verify source and build reproducible artifacts
        run: |
          python3 tests/test_release_policy.py
          python3 tests/test_build_integrity.py
          python3 tests/build_public_release.py dist
      - name: Prepare or publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_CONFIRMED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_confirmed && '1' || '0' }}
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: GITHUB_SHA=$(git rev-parse HEAD) python3 tools/publish_test_release.py dist
